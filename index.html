<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9e9f0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="一份写给你的生日礼物：便签围成爱心，星河蛋糕等你吹蜡烛。">
<title>生日快乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div class="bg-glow" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<p id="scriptWord" class="script-word" aria-hidden="true">生日快乐</p>

<div id="centerCard" class="center-card">
  <h2 class="cc-title">生日快乐 <span class="cc-heart">❤</span></h2>
  <p class="cc-sub">愿你新的一岁，继续闪闪发光</p>
  <button id="btnToCake" class="cc-btn" type="button"><span>🍰</span> 进入星河蛋糕</button>
</div>

<header class="hud">
  <div class="hud-name">FOR <b id="hudTo">朋友</b></div>
  <div class="hud-btns">
    <button id="btnSound" class="icon-btn" type="button" aria-pressed="false" aria-label="背景音乐">♪</button>
    <button id="btnReplay" class="icon-btn" type="button" aria-label="重新播放">↻</button>
  </div>
</header>

<p id="hint" class="hint">拖动旋转 · 双指/滚轮缩放 · 点便签看祝福</p>

<button id="btnBlow" class="cta" type="button">吹蜡烛，许个愿</button>

<div id="bigWish" class="big-wish" aria-live="polite">
  <span class="bw-line1">生日快乐</span>
  <span class="bw-line2">愿你新的一岁，一直被温柔以待</span>
</div>

<div id="cardModal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <span class="modal-no"></span>
    <h2 id="modalTitle" class="modal-title"></h2>
    <p class="modal-text"></p>
    <p class="modal-from"></p>
    <button class="modal-close" type="button">收好这张</button>
  </div>
</div>

<div id="photoModal" class="modal photo-modal" hidden>
  <div class="photo-card" role="dialog" aria-modal="true" aria-labelledby="photoCaption">
    <div class="photo-frame">
      <img id="photoImg" alt="生日照片" hidden>
      <div id="photoPlaceholder" class="photo-placeholder">
        <span class="ph-icon">📷</span>
        <span class="ph-text">这里会放一张我们的照片</span>
        <span class="ph-hint">把图片放进 assets/ 并在 config.js 填 photo</span>
      </div>
    </div>
    <p id="photoCaption" class="photo-caption"></p>
    <button class="modal-close" type="button" id="photoClose">收好</button>
  </div>
</div>

<div id="videoStage" class="video-stage" hidden>
  <video id="introVideo" playsinline preload="auto" src="assets/intro.mp4"></video>
</div>

<div id="blackout" class="blackout" aria-hidden="true"></div>

<div id="gate" class="gate">
  <div class="gate-inner">
    <p class="gate-kicker">A CAKE FOR YOU</p>
    <h1 class="gate-title">给 <b id="gateTo">朋友</b> 的<br>生日蛋糕</h1>
    <p class="gate-sub">轻触屏幕，拆开这份礼物</p>
    <button id="btnStart" class="gate-btn" type="button">点击拆开</button>
    <p class="gate-tip">建议戴上耳机 ♪</p>
  </div>
</div>

<div id="loading" class="loading">正在点亮…</div>

<noscript><p class="noscript">请开启 JavaScript 才能打开这份礼物。</p></noscript>

<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
